name: PlayGlide
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PlayGlide:
    type: application
    platform: macOS
    sources:
      - path: src/PlayGlide
    info:
      path: config/Info.plist
      properties:
        CFBundleDisplayName: PlayGlide
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        LSMultipleInstancesProhibited: true
        NSCameraUsageDescription: PlayGlide uses video from your selected capture card for local preview and frame interpolation.
        NSMicrophoneUsageDescription: PlayGlide uses audio from your selected capture card for local playback and video sync.
        NSHighResolutionCapable: true
    entitlements:
      path: config/PlayGlide.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Metal.framework
      - sdk: CoreImage.framework
      - sdk: QuartzCore.framework
      - sdk: MetalFX.framework
      - sdk: VideoToolbox.framework
      - sdk: Vision.framework
      - sdk: ScreenCaptureKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eliosxie.PlayGlide
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  PlayGlide:
    build:
      targets:
        PlayGlide: all
    run:
      config: Debug
    archive:
      config: Release
